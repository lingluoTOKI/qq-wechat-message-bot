<!doctype html>
<!-- 流派混合 Style Mix 导出：骨架 风格派，表皮 青绿山水。https://tasteux.com/#mix=de-stijl+blue-green -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Pages · 风格派 × 青绿山水</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Archivo:wght@400;600&amp;display=swap">
<style>
.pv { --radius: 0px; container-type: inline-size; position: relative; overflow: hidden; isolation: isolate; min-height: 620px; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.55; transition: background-color 240ms ease-out, color 240ms ease-out; }
:where(.pv) :where(h2, h3, p) { margin: 0px; }
.pv-tex { position: absolute; inset: 0px; z-index: 0; pointer-events: none; }
.pv-page { position: relative; z-index: 1; display: grid; gap: 24px; align-content: start; min-height: 620px; padding: 28px 32px; }
.pv-nav { display: flex; justify-content: space-between; align-items: center; gap: 16px; font-size: 13px; }
.pv-logo, .pv-title, .pv-cell b { font-family: var(--font-display); font-weight: var(--display-weight); text-transform: var(--display-transform); letter-spacing: var(--display-tracking); }
.pv-logo { font-size: 16px; }
.pv-links { display: flex; gap: 18px; color: var(--muted); }
.pv-kicker { font-size: 12px; letter-spacing: 0.08em; color: var(--muted); }
.pv-title { margin: 12px 0px 0.3em; font-size: clamp(44px, 11cqi, 104px); line-height: 0.95; }
.pv-title span { display: block; }
.pv-lede { max-width: 26em; color: var(--muted); }
.pv-cta { display: inline-block; margin-top: 22px; padding: 11px 20px; font-size: 14px; font-weight: 600; color: var(--on-accent); background: var(--accent); border-radius: var(--radius); }
.pv-art { position: relative; pointer-events: none; }
.pv-art i { position: absolute; display: block; }
.pv-img { position: absolute; z-index: 0; margin: 0px; overflow: hidden; pointer-events: none; background: var(--surface); }
.pv-img picture { display: block; width: 100%; height: 100%; }
.pv-img img { display: block; width: 100%; height: 100%; object-fit: cover; }
.pv[data-img="none"] .pv-img { display: none; }
.pv-cells { display: grid; grid-template-columns: repeat(3, minmax(0px, 1fr)); gap: 14px; }
.pv-cell { padding: 18px; background: var(--surface); border-radius: var(--radius); }
.pv-cell b { display: block; margin-bottom: 12px; font-size: 30px; line-height: 1; }
.pv-cell h3 { margin-bottom: 4px; font-size: 15px; font-weight: 600; }
.pv-cell p { font-size: 13px; color: var(--muted); }
.pv-foot { font-size: 12px; color: var(--muted); }
.pv[data-structure="de-stijl"] .pv-page { grid-template-columns: 1.5fr 1fr 1fr; grid-template-rows: auto 1fr auto auto; gap: 8px; padding: 8px; background: var(--line); }
.pv[data-structure="de-stijl"] .pv-nav, .pv[data-structure="de-stijl"] .pv-hero, .pv[data-structure="de-stijl"] .pv-cell, .pv[data-structure="de-stijl"] .pv-foot { padding: 18px 20px; background: var(--bg); }
.pv[data-structure="de-stijl"] .pv-nav { grid-column: 1 / -1; }
.pv[data-structure="de-stijl"] .pv-hero { grid-column: 1; display: flex; flex-direction: column; justify-content: flex-end; min-height: 340px; }
.pv[data-structure="de-stijl"] .pv-title { font-size: clamp(40px, 8.5cqi, 84px); line-height: 0.95; }
.pv[data-structure="de-stijl"] .pv-cta { align-self: flex-start; }
.pv[data-structure="de-stijl"] .pv-art { grid-column: 2 / -1; display: grid; grid-template-columns: 1.6fr 1fr; grid-template-rows: 1.4fr 1fr; gap: 8px; }
.pv[data-structure="de-stijl"] .pv-art i { position: static; }
.pv[data-structure="de-stijl"] .d1 { grid-row: 1 / 3; background: var(--accent); }
.pv[data-structure="de-stijl"] .d2 { background: var(--bg); }
.pv[data-structure="de-stijl"] .d3 { background: var(--accent2); }
.pv[data-structure="de-stijl"] .d4 { display: none !important; }
.pv[data-structure="de-stijl"] .pv-img { grid-area: 2 / 2 / 3 / -1; top: 0px; bottom: 0px; left: 0px; width: calc(61.5385% - 4.92308px); background: var(--accent); }
.pv[data-structure="de-stijl"] .pv-cells { display: contents; }
.pv[data-structure="de-stijl"] .c2 { background: var(--accent3); color: var(--on-accent3); }
.pv[data-structure="de-stijl"] .c2 p { color: inherit; }
.pv[data-structure="de-stijl"] .pv-foot { grid-column: 1 / -1; }
.pv[data-texture="silk"] .pv-tex { background: var(--line); opacity: calc(var(--tex-level) * 0.3); mask: repeating-linear-gradient(0deg, rgb(0, 0, 0) 0px, rgb(0, 0, 0) 1px, transparent 1px, transparent 4px), repeating-linear-gradient(90deg, rgb(0, 0, 0) 0px, rgb(0, 0, 0) 1px, transparent 1px, transparent 4px); }
@container (max-width: 560px) {
  .pv .pv-page { padding: 20px; grid-template-columns: minmax(0px, 1fr) !important; }
  .pv .pv-page > *, .pv[data-structure="de-stijl"] .pv-cell { grid-area: auto / 1 / auto / -1 !important; }
  .pv .pv-cells { grid-template-columns: minmax(0px, 1fr) !important; margin-top: 0px !important; }
  .pv .pv-links { display: none; }
  .pv[data-structure="de-stijl"] .pv-page { grid-template-rows: none; padding: 6px; gap: 6px; }
  .pv[data-structure="de-stijl"] .pv-hero { min-height: 0px; }
  .pv[data-structure="de-stijl"] .pv-art { min-height: 120px; }
  .pv[data-structure="de-stijl"] .pv-page > .pv-img { grid-row: 3 / 4 !important; }
}
@media (prefers-reduced-motion: reduce) {
  .pv { transition: none; }
}
*, *::before, *::after { box-sizing: border-box; }
:where(.pv) a { color: inherit; text-decoration: none; }
:where(.pv) h1 { margin: 0; }
html { background: oklch(0.93 0.025 90); }
html, body { margin: 0; }
body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
.pv, .pv > .pv-page { min-height: 100vh; }
.pv-page { max-width: 1440px; margin-inline: auto; }
</style>
